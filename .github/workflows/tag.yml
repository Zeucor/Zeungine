name: Release on Tag
on:
  push:
    tags:
      - 'v*.*.*.*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Dependencies on Linux
        if: runner.os == 'Linux'
        run: sudo apt install nasm libx11-dev uuid-dev libglx-dev libgl1-mesa-dev libxfixes-dev libxrandr-dev libxkbcommon-dev libdrm-dev ninja-build
        shell: bash

      - name: Build Package on Linux
        if: runner.os == 'Linux'
        run: ./unx-package.sh 0
        shell: bash

      - name: Build Package on Windows
        if: runner.os == 'Windows'
        run: .\win-package.bat 0

      - name: Get Commit Messages
        id: commit_messages
        run: |
          PREV_HASH=$(git rev-list --tags --skip 1 --max-count 1)
          PREV_TAG=$(git describe --abbrev=0 --tags $PREV_HASH || echo "")
          if [ -z "$PREV_TAG" ]
          then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          COMMITS=$(git log $PREV_TAG..$GITHUB_SHA --oneline)
          echo "::set-output name=commits::$COMMITS"
        shell: bash

      - name: Create GitHub Release (Linux Only)
        if: runner.os == 'Linux'
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "Release ${{ github.ref_name }}"
          body: ${{ steps.commit_messages.outputs.commits }}

      - name: Upload Artifacts for Linux
        if: runner.os == 'Linux'
        run: |
          declare -A artifacts
          artifacts["releases/zeungine.deb"]="application/vnd.debian.binary-package"
          artifacts["releases/zeungine-debug.deb"]="application/vnd.debian.binary-package"
          artifacts["releases/zeungine-static.deb"]="application/vnd.debian.binary-package"
          artifacts["releases/zeungine-debug-static.deb"]="application/vnd.debian.binary-package"
          artifacts["releases/zeungine-dependencies.deb"]="application/vnd.debian.binary-package"
          artifacts["releases/zeungine-dependencies-debug.deb"]="application/vnd.debian.binary-package"
          artifacts["releases/zeungine-dependencies-debug-static.deb"]="application/vnd.debian.binary-package"
          artifacts["releases/zeungine-headers.deb"]="application/vnd.debian.binary-package"
          artifacts["deb-auto-install.sh"]="application/octet-stream"
          for key in "${!artifacts[@]}"
          do
            file="${key}"
            echo "Uploading $file"
            curl --data-binary @"$file" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: ${artifacts[$key]}" \
              "${{ steps.create_release.outputs.upload_url }}?name=$(basename $file)"
          done
        shell: bash

      - name: Upload Artifacts for Windows
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          # Query the release by tag to get the upload URL
          $release = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/${env:GITHUB_REPOSITORY}/releases/tags/${env:GITHUB_REF_NAME}" -Headers @{ Authorization = "token $env:GITHUB_TOKEN" }
          $uploadUrl = $release.upload_url.Split("{")[0]
          $artifacts = @{
            "releases/Zeungine" = "application/octet-stream"
            "releases/Zeungine-debug" = "application/octet-stream"
            "releases/Zeungine-debug-static" = "application/octet-stream"
            "releases/ZeungineDependencies" = "application/octet-stream"
            "releases/ZeungineDependencies-debug" = "application/octet-stream"
            "releases/ZeungineDependencies-debug-static" = "application/octet-stream"
            "releases/ZeungineHeaders" = "application/octet-stream"
            "auto-install.bat" = "application/octet-stream"
          }
          foreach ($key in $artifacts.Keys)
          {
            $file = "$key.exe"
            Write-Output "Uploading $file"
            Invoke-RestMethod -Method Post -Uri "$uploadUrl?name=$([System.IO.Path]::GetFileName($file))" -Headers @{
              Authorization = "token $env:GITHUB_TOKEN"
              "Content-Type" = $artifacts[$key]
            } -InFile $file -ContentType $artifacts[$key]
          }
        shell: pwsh
